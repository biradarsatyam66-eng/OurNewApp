<h2 class="text-center text-danger"><strong class="border-bottom border-danger">COMMENTS</strong></h2>


<div class="container">
    <div class="row mt-3">
        <div 
        *ngFor="let c of comment"
        class="col-md-3 mb-3">
            <div class="card h-100">
                <div class="card-header font-weight-bold">{{c.name}}.</div>
                <div class="card-body">
                    <p>{{c.body}}</p>

                    <hr>

                    <h6>{{c.email}}</h6>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button class="btn btn-warning btn-sm">Edit</button>
                    <button class="btn btn-danger btn-sm">Delete</button>
                </div>
            </div>
        </div>
    </div>
</div>
