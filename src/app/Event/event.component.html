<div class="container">
    <div class="row mt-5">
        <div class="col-md-12">
            <button
            [disabled]="productCount >= 5"
            (click)="onProductAdd()"
            class="mr-4" mat-raised-button color="primary">Add</button>

            <button
            [disabled]="productCount == 0"
            (click)="onProductRemove()"
            mat-raised-button color="warn">Remove</button>

            <p class="mt-3 bg-secondary p-2 rounded text-white" mat-card-title>{{productMsg}}</p>
        </div>
    </div>
</div>
<hr class="bg-primary">

<h2 class="text-center text-danger"><strong class="border-bottom border-danger">Cards ADD/Remove Task</strong></h2>


<div class="container mt-2">
    <button
    [disabled]="card.length >= 10"
    (click)="onCardAdd()"
    class="mr-4" mat-raised-button color="primary">Add</button>

    <button
    [disabled]="card.length == 0"
    (click)="onCardRemove()"
    mat-raised-button color="warn">Remove</button>

    <div class="row">
        <div
        *ngFor="let c of card"
        class="col-md-4 mb-3">


            <mat-card class="mt-3">
                <mat-card-title-group>
                    <mat-card-title>{{c.pname}}</mat-card-title>
                    <mat-card-subtitle>{{c.rating}}</mat-card-subtitle>
                    <img mat-card-xl-image [src]="c.img">
                </mat-card-title-group>
                <mat-card-content>
                    {{c.description}}
                </mat-card-content>
                <mat-card-actions>
                    <button mat-button color="primary">Edit</button>
                    <button mat-button color="warn">Delete</button>
                </mat-card-actions>
            </mat-card>
        </div>
    </div>
</div>
